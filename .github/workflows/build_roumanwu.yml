name: Build and Publish Roumanwu

on:
  push:
    branches:
      - main
    paths:
      - 'src/zh/roumanwu/**'
      - '.github/scripts/**'
      - '.github/workflows/build_roumanwu.yml'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roumanwu-publish
  cancel-in-progress: false

env:
  EXTENSIONS_REPO: ${{ github.repository }}
  SOURCE_REPO: ${{ github.repository }}
  REPO_DISPLAY_NAME: "joker1001s Extensions"

jobs:

  build:
    name: Build Roumanwu
    runs-on: ubuntu-latest

    steps:

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          printf '%s' "$SIGNING_KEY" | base64 --decode > signingkey.jks
          chmod 600 signingkey.jks

      - name: Build Roumanwu
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :src:zh:roumanwu:assembleRelease

      - name: Lint Roumanwu
        run: |
          ./gradlew :src:zh:roumanwu:lintRelease

      - name: Upload Roumanwu build
        uses: actions/upload-artifact@v4
        with:
          name: roumanwu-build
          path: src/zh/roumanwu/build/
          retention-days: 7

      - name: Remove signing key
        if: always()
        run: |
          rm -f signingkey.jks


  publish:
    name: Publish repo branch
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: roumanwu-build
          path: ${{ runner.temp }}/roumanwu-build

      - name: Prepare artifact directory
        run: |
          mkdir -p \
            "$HOME/apk-artifacts/src/zh/roumanwu/build"

          cp -a \
            "${{ runner.temp }}/roumanwu-build/." \
            "$HOME/apk-artifacts/src/zh/roumanwu/build/"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install protobuf
        run: |
          python -m pip install --upgrade pip
          python -m pip install protobuf==7.35.1

      - name: Check GitHub CLI
        run: |
          gh --version

      - name: Prepare repo branch
        env:
          REPO_DIR: ${{ runner.temp }}/repo
        run: |

          git fetch origin repo || true

          if git show-ref --verify --quiet refs/remotes/origin/repo; then

            git worktree add \
              "$REPO_DIR" \
              origin/repo

          else

            mkdir -p "$REPO_DIR"

            git init "$REPO_DIR"

            cd "$REPO_DIR"

            git remote add origin \
              "https://github.com/${GITHUB_REPOSITORY}.git"

            git checkout --orphan repo

          fi

      - name: Generate repository
        env:
          GH_TOKEN: ${{ github.token }}

          EXTENSIONS_REPO: ${{ github.repository }}
          SOURCE_REPO: ${{ github.repository }}

          REPO_DISPLAY_NAME: "YOUR_USERNAME Extensions"

          SIGNING_KEY_FINGERPRINT: ${{ secrets.SIGNING_KEY_FINGERPRINT }}

          SOURCE_DIR: ${{ github.workspace }}
          REPO_DIR: ${{ runner.temp }}/repo

        run: |
          python .github/scripts/publish-repo.py

      - name: Commit repo branch
        working-directory: ${{ runner.temp }}/repo
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then

            echo "No changes to repo branch."

          else

            git commit \
              -m "Update extension repository"

            git push origin HEAD:repo

          fi
